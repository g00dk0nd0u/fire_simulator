<style>
:root{--color-bg:#f4f7fb;--color-surface:rgba(255,252,248,.74);--color-surface-strong:rgba(255,252,248,.88);--color-surface-alt:rgba(246,240,232,.60);--color-border:rgba(195,180,160,.28);--color-text-primary:#2c3a4a;--color-text-secondary:#6a849a;--color-text-muted:#9fb3c4;--color-accent:#4a90b8;--color-accent-hover:#357fa8;--color-danger:#c05a5a;--font-base:'Inter','Noto Sans JP',sans-serif;--font-mono:'JetBrains Mono',monospace;--radius-card:22px;--blur-card:blur(18px) saturate(1.15);--shadow-card:0 18px 48px rgba(74,130,170,.13),0 1px 4px rgba(0,0,0,.04),inset 0 1px 0 rgba(255,255,255,.72)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}html{scroll-behavior:smooth}body{min-height:100vh;color:var(--color-text-primary);font-family:var(--font-base);line-height:1.72;overflow-x:hidden;letter-spacing:.01em;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);background:radial-gradient(ellipse 65% 55% at 14% 0%,rgba(255,210,170,.38),transparent),radial-gradient(ellipse 55% 45% at 90% 8%,rgba(170,225,228,.34),transparent),radial-gradient(ellipse 75% 55% at 48% 100%,rgba(195,230,210,.30),transparent),linear-gradient(172deg,#f6f0e9 0%,#edf5f8 52%,#f0f8f4 100%)}body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;background:radial-gradient(ellipse 60% 50% at 28% 18%,rgba(255,230,200,.38),transparent);filter:blur(40px)}.hero,.layout{position:relative;z-index:1;max-width:980px;margin:0 auto}.hero{padding:52px 24px 24px;border-bottom:1px solid var(--color-border)}h1{font-size:clamp(1.7rem,4vw,2.6rem);font-weight:700;letter-spacing:.055em;background:linear-gradient(118deg,#2e6090 0%,#4aab96 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}.layout{padding:0 24px 72px}.sec{font-size:.74rem;font-weight:700;letter-spacing:.12em;color:var(--color-text-muted);text-transform:uppercase;margin:44px 0 14px;display:flex;align-items:center;gap:10px}.sec::after{content:'';flex:1;height:1px;background:linear-gradient(90deg,var(--color-border),transparent)}.chart-card,.input-panel,.rcard{background:var(--color-surface);backdrop-filter:var(--blur-card);-webkit-backdrop-filter:var(--blur-card);border:1px solid var(--color-border);border-radius:var(--radius-card);box-shadow:var(--shadow-card)}.input-panel{padding:26px 22px}.form-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 24px}@media(max-width:900px){.form-grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:640px){.form-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:400px){.form-grid{grid-t rgba(74,144,184,.28),transparent 52%)}.rcard.con::before{background:radial-gradient(circle at 18% 0%,rgba(196,126,106,.26),transparent 52%)}.rcard-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.rcard-name{font-size:1.06rem;font-weight:600;line-height:1.1}.rcard-rate{font-size:.62rem;font-weight:600;color:var(--color-text-secondary);background:var(--color-surface-alt);padding:3px 8px;border-radius:999px;margin-top:3px}.nb{display:flex;flex-direction:column;gap:2px}.nb-lbl{font-size:.6rem;letter-spacing:.08em;color:var(--color-text-muted);text-transform:uppercase;font-weight:600}.nb-val{font-size:1.28rem;font-weight:700;line-height:1.08;letter-spacing:-.01em;word-break:break-word}.nb-val.gold{color:#c07d2a}.nb-val.small{font-size:.92rem;line-height:1.3}.nb-sub{font-size:.6rem;font-weight:600;color:var(--color-text-secondary);margin-top:2px;letter-spacing:.03em}.csep{height:1px;background:var(--color-border)}.chart-card{padding:24px 20px 22px}.chart-head{display:flex;align-items:baseline;gap:12px;margin-bottom:18px;flex-wrap:wrap}.chart-title{font-size:1rem;font-weight:700}.chart-note{font-size:.62rem;font-weight:600;color:var(--color-text-secondary)}.chart-fallback{display:none;margin-top:10px;font-size:.75rem;color:var(--color-text-secondary)}#myChart{width:100%!important;height:360px!important}@media(max-width:640px){.chart-card{padding:22px 14px 20px}#myChart{height:420px!important}}

<body>
<header class="hero"><h1>FIRE Calculator</h1></header>
<div class="layout">
  <div class="chart-card"><div class="chart-head"><span class="chart-title">Asset Projection 資産の見通し</span><span class="chart-note">各シナリオのFIRE時点を起点に表示</span></div><canvas id="myChart"></canvas><div id="chart-fallback" class="chart-fallback"></div></div>
  <p class="sec">Planning Inputs 入力条件</p>
  <div class="input-panel"><div class="form-grid">
    <div class="fg"><div class="fg-head"><label for="currentAge"><span>Current Age</span><span class="label-ja">現在年齢</span></label><span class="slider-value" id="currentAgeDisplay"></span></div><input type="range" id="currentAge" min="0" max="99" step="1"><span class="unit"><span>0-99</span><span>歳</span></span></div>
    <div class="fg"><div class="fg-head"><label for="lifeAge"><span>Life Expectancy</span><span class="label-ja">想定寿命</span></label><span class="slider-value" id="lifeAgeDisplay"></span></div><input type="range" id="lifeAge" min="1" max="120" step="1"><span class="unit"><span>1-120</span><span>歳</span></span></div>
    <div class="fg"><div class="fg-head"><label for="monthlyExpense"><span>Monthly Spending</span><span class="label-ja">月間生活費</span></label><span class="slider-value" id="monthlyExpenseDisplay"></span></div><input type="range" id="monthlyExpense" min="0" max="1000000" step="10000"><span class="unit"><span>0-100万円</span><span>円 / 月</span></span></div>
    <div class="fg"><div class="fg-head"><label for="sp500Asset"><span>Current Assets</span><span class="label-ja">現在のSP500資産</span></label><span class="slider-value" id="sp500AssetDisplay"></span></div><input type="range" id="sp500Asset" min="0" max="100000000" step="100000"><span class="unit"><span>0-1億円</span><span>円</span></span></div>
    <div class="fg"><div class="fg-head"><label for="annualSp500Contribution"><span>Annual Investment</span><span class="label-ja">年間平均SP500投資額</span></label><span class="slider-value" id="annualSp500ContributionDisplay"></span></div><input type="range" id="annualSp500Contribution" min="0" max="5000000" step="10000"><span class="unit"><span>0-500万円</span><span>円 / 年</span></span></div>
    <div class="fg"><div class="fg-head"><label for="annualPension"><span>Estimated Pension</span><span class="label-ja">65歳基準の年金見込額</span></label><span class="slider-value" id="annualPensionDisplay"></span></div><input type="range" id="annualPension" min="0" max="4000000" step="10000"><span class="unit"><span>0-400万円</span><span>円 / 年</span></span><div class="field-note"><a href="https://www.nenkin.go.jp/n_net2/index.html" target="_blank" rel="noopener noreferrer">日本年金機構で見込み額を確認</a></div></div>
    <div class="fg"><div class="fg-head"><label for="pensionStartAge"><span>Pension Start Age</span><span class="label-ja">年金受給開始年齢</span></label><span class="slider-value" id="pensionStartAgeDisplay"></span></div><input type="range" id="pensionStartAge" min="60" max="75" step="1"><span class="unit"><span>60-75</span><span>歳</span></span></div>
    <div class="fg"><div class="fg-head"><label for="inflationRate"><span>Inflation Rate</span><span class="label-ja">インフレ率</span></label><span class="slider-value" id="inflationRateDisplay"></span></div><input type="range" id="inflationRate" min="0" max="4.5" step="0.05"><span class="unit"><span>0-4.5</span><span>%</span></span></div>
  </div><div id="error-msg"></div><div id="info-msg" class="info-msg"></div></div>
  <div id="result-section"><p class="sec">FIRE Scenarios シナリオ</p><div class="cards-grid" id="cards-grid"></div></div>
</div>
<script>
'use strict';
const STORAGE_KEY='fire_simulator_v6';
const PENSION_BASE_AGE=65,NATIONAL_PENSION_PREMIUM_END_AGE=60,NATIONAL_PENSION_MONTHLY_PREMIUM=17920,PENSION_EARLY_ADJUST_PER_MONTH=.004,PENSION_DEFER_ADJUST_PER_MONTH=.007;
const RATES={optimistic:.115,normal:.09};
const LABELS={optimistic:'Optimistic 楽観',normal:'Base 標準',conservative:'Conservative 保守'};
const COLORS={optimistic:'#5aad8f',normal:'#4a90b8',conservative:'#c47e6a'};
const CLS={optimistic:'opt',normal:'nrm',conservative:'con'};
const NUMBER_IDS=['currentAge','lifeAge','monthlyExpense','sp500Asset','annualSp500Contribution','annualPension','pensionStartAge','inflationRate'];
const HISTORY_START_YEAR=1946;
let chartInst=null,HIST_RETURNS=[],HISTORY_META=null;
function getDefaultValues(){return{currentAge:45,lifeAge:100,monthlyExpense:280000,sp500Asset:18000000,annualSp500Contribution:1200000,annualPension:1100000,pensionStartAge:75,inflationRate:1.25}}
function loadState(){try{return Object.assign({},getDefaultValues(),JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}'))}catch{return getDefaultValues()}}
function saveState(v){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(v))}catch{}}
function getFormValues(){const v={};for(const id of NUMBER_IDS){v[id]=parseFloat(document.getElementById(id).value);if(Number.isNaN(v[id]))v[id]=0}return v}
function setFormValues(v){for(const id of NUMBER_IDS)document.getElementById(id).value=v[id];updateSliderDisplays(v)}
function formatOkuMan(value){const neg=value<0,prefix=neg?'▲':'';const man=Math.round(Math.abs(value)/10000);if(man>=10000){const oku=Math.floor(man/10000),rem=man%10000;return prefix+(rem===0?`${oku}億円`:`${oku}億${rem.toLocaleString('ja-JP')}万円`)}return prefix+`${man.toLocaleString('ja-JP')}万円`}
function formatYen(v){return Math.round(v).toLocaleString('ja-JP')+' 円'}
function formatPercentCompact(v){return `${parseFloat(v.toFixed(2))}%`}
function updateSliderDisplays(v){for(const id of NUMBER_IDS){const el=document.getElementById(id),d=document.getElementById(id+'Display');if(!el||!d)continue;const x=v[id];if(['currentAge','lifeAge','pensionStartAge'].includes(id))d.textContent=`${x} 歳`;else if(id==='inflationRate')d.textContent=formatPercentCompact(x);else if(id==='monthlyExpense')d.textContent=formatOkuMan(x).replace('円','')+' / 月';else if(['annualSp500Contribution','annualPension'].includes(id))d.textContent=formatOkuMan(x).replace('円','')+' / 年';else d.textContent=formatOkuMan(x);const min=+el.min,max=+el.max;el.style.setProperty('--pct',`${((x-min)/(max-min))*100}%`)}}
function validateInputs(v){const e=[];if(v.lifeAge<=v.currentAge)e.push('想定寿命は現在年齢より大きくしてください。');if(v.monthlyExpense<0||v.sp500Asset<0||v.annualSp500Contribution<0||v.annualPension<0)e.push('金額は0以上にしてください。');if(v.pensionStartAge<60||v.pensionStartAge>75)e.push('年金受給開始年齢は60〜75歳です。');if(v.inflationRate<0||v.inflationRate>4.5)e.push('インフレ率は0〜4.5%です。');return e}
function showError(a){const e=document.getElementById('error-msg');e.textContent=a.join('\n');e.style.display='block'}function hideError(){document.getElementById('error-msg').style.display='none'}function showInfo(s){const e=document.getElementById('info-msg');e.textContent=s;e.style.display='block'}function hideInfo(){document.getElementById('info-msg').style.display='none'}
function toMonthAge(y){return Math.round(y*12)}
function formatAgeWithMonths(m){const y=Math.floor(m/12),mo=m%12;return mo?`${y} 歳 ${mo} ヶ月`:`${y} 歳`}
function formatDurationMonths(m){const y=Math.floor(m/12),mo=m%12;if(m<=0)return'0ヶ月後に成立';if(!mo)return`${y}年後に成立`;if(!y)return`${mo}ヶ月後に成立`;return`${y}年${mo}ヶ月後に成立`}
function getAdjustedAnnualPension(v){const dy=v.pensionStartAge-PENSION_BASE_AGE,dm=Math.abs(dy)*12,rate=dy>=0?1+dm*PENSION_DEFER_ADJUST_PER_MONTH:1-dm*PENSION_EARLY_ADJUST_PER_MONTH;return{pensionAdjustRate:Math.max(0,rate),adjustedAnnualPension:Math.max(0,v.annualPension*rate)}}
function formatPensionAdjustmentNote(r){const d=(r-1)*100;return d>0?`+${d.toFixed(1)}% 増額後`:d<0?`${d.toFixed(1)}% 減額後`:'65歳基準'}
function monthlyNetExpense(ageMonth,v,adjustedAnnualPension){const pension=ageMonth>=toMonthAge(v.pensionStartAge)?adjustedAnnualPension/12:0;const premium=ageMonth<toMonthAge(NATIONAL_PENSION_PREMIUM_END_AGE)?NATIONAL_PENSION_MONTHLY_PREMIUM:0;return v.monthlyExpense+premium-pension}
function getMonthlyRate(rate){return Math.pow(1+rate,1/12)-1}function getRealAnnualRate(rate,inflPct){return(1+rate)/(1+inflPct/100)-1}function getScenarioMonthlyRate(rate,v){return getMonthlyRate(getRealAnnualRate(rate,v.inflationRate))}
function projectAssetsToAge(targetAgeMonth,rate,v){const months=targetAgeMonth-toMonthAge(v.currentAge),mr=getScenarioMonthlyRate(rate,v);let a=v.sp500Asset*Math.pow(1+mr,months);if(months>0&&v.annualSp500Contribution>0){const c=v.annualSp500Contribution/12;a+=mr===0?c*months:c*(Math.pow(1+mr,months)-1)/mr}return a}
function findRequiredFixedAsset(startAgeMonth,rate,v){const mr=getScenarioMonthlyRate(rate,v),{adjustedAnnualPension}=getAdjustedAnnualPension(v);let req=0;for(let age=toMonthAge(v.lifeAge)-1;age>=startAgeMonth;age--){req=Math.max(0,(req+monthlyNetExpense(age,v,adjustedAnnualPension))/(1+mr))}return req}
function generateFixedSeries(startAgeMonth,asset,rate,v){const mr=getScenarioMonthlyRate(rate,v),{adjustedAnnualPension}=getAdjustedAnnualPension(v),ages=[startAgeMonth/12],bals=[asset];let b=asset;for(let age=startAgeMonth;age<toMonthAge(v.lifeAge);age++){b=b*(1+mr)-monthlyNetExpense(age,v,adjustedAnnualPension);ages.push((age+1)/12);bals.push(b)}return{ages,bals}}
function calculateFixedScenario(rate,v){const cur=toMonthAge(v.currentAge),life=toMonthAge(v.lifeAge),p=getAdjustedAnnualPension(v);let fallback=null;for(let age=cur;age<life;age++){const required=findRequiredFixedAsset(age,rate,v),projected=projectAssetsToAge(age,rate,v),coverage=required>0?projected/required*100:Infinity;const row={currentAgeMonths:cur,fireAgeMonths:age,requiredTotalAtRetirement:required,projectedAssetsAtRetirement:projected,adjustedAnnualPension:p.adjustedAnnualPension,pensionAdjustRate:p.pensionAdjustRate,retirementSurplus:projected-required,coverageRate:coverage,isAchievable:projected>=required};if(!fallback||coverage>fallback.coverageRate)fallback=row;if(row.isAchievable)return row}return Object.assign(fallback||{},{isAchievable:false,fireAgeMonths:null})}
function monthAtOffset(start,offset){let [y,m]=start.split('-').map(Number);const n=(m-1)+offset;return{year:y+Math.floor(n/12),month:n%12+1}}
function ymLabel(x){return`${x.year}-${String(x.month).padStart(2,'0')}`}
function buildHistoricalReturns(){const d=window.__lfcSpData;if(!d||!Array.isArray(d.nomTRP)||d.nomTRP.length<2)return[];const out=[];for(let i=1;i<d.nomTRP.length;i++){const ym=monthAtOffset(d.start,i);if(ym.year<HISTORY_START_YEAR)continue;const prev=d.nomTRP[i-1],cur=d.nomTRP[i];if(Number.isFinite(prev)&&Number.isFinite(cur)&&prev>0)out.push({year:ym.year,month:ym.month,nominalReturn:cur/prev-1})}if(out.length)HISTORY_META={start:ymLabel(out[0]),end:ymLabel(out[out.length-1]),count:out.length};return out}
function buildConservativeRequirements(v){if(!HIST_RETURNS.length)return new Map();const N=HIST_RETURNS.length,curAge=toMonthAge(v.currentAge),life=toMonthAge(v.lifeAge),{adjustedAnnualPension}=getAdjustedAnnualPension(v),monthlyInfl=Math.pow(1+v.inflationRate/100,1/12)-1,real=HIST_RETURNS.map(x=>(1+x.nominalReturn)/(1+monthlyInfl)-1),plans=new Map();let next=new Float64Array(N+1);const firstValidAge=Math.max(curAge,life-N);for(let age=life-1;age>=firstValidAge;age--){const duration=life-age,maxStart=N-duration,current=new Float64Array(N+1),expense=monthlyNetExpense(age,v,adjustedAnnualPension);let worst=-1,worstStart=-1;for(let s=0;s<=maxStart;s++){const denom=1+real[s];const req=Math.max(0,(next[s+1]+expense)/denom);current[s]=req;if(req>worst){worst=req;worstStart=s}}plans.set(age,{requiredTotalAtRetirement:worst,worstStart,duration});next=current}return plans}
function historicalWindowStats(start,duration){let factor=1;for(let i=0;i<duration;i++)factor*=1+HIST_RETURNS[start+i].nominalReturn;const cagr=Math.pow(factor,12/duration)-1;const a=HIST_RETURNS[start],b=HIST_RETURNS[start+duration-1];return{historyStart:`${a.year}-${String(a.month).padStart(2,'0')}`,historyEnd:`${b.year}-${String(b.month).padStart(2,'0')}`,historyCagr:cagr}}
function generateHistoricalSeries(startAgeMonth,asset,startIndex,duration,v){const {adjustedAnnualPension}=getAdjustedAnnualPension(v),monthlyInfl=Math.pow(1+v.inflationRate/100,1/12)-1,ages=[startAgeMonth/12],bals=[asset];let b=asset;for(let i=0;i<duration;i++){const r=(1+HIST_RETURNS[startIndex+i].nominalReturn)/(1+monthlyInfl)-1,age=startAgeMonth+i;b=b*(1+r)-monthlyNetExpense(age,v,adjustedAnnualPension);ages.push((age+1)/12);bals.push(b)}return{ages,bals}}
function calculateConservativeScenario(v){const cur=toMonthAge(v.currentAge),life=toMonthAge(v.lifeAge),p=getAdjustedAnnualPension(v);if(!HIST_RETURNS.length)return{currentAgeMonths:cur,isAchievable:false,unavailable:true,adjustedAnnualPension:p.adjustedAnnualPension,pensionAdjustRate:p.pensionAdjustRate};const plans=buildConservativeRequirements(v);let fallback=null;for(let age=cur;age<life;age++){const plan=plans.get(age);if(!plan)continue;const projected=projectAssetsToAge(age,RATES.normal,v),coverage=plan.requiredTotalAtRetirement>0?projected/plan.requiredTotalAtRetirement*100:Infinity,stats=historicalWindowStats(plan.worstStart,plan.duration);const row={currentAgeMonths:cur,fireAgeMonths:age,isAchievable:projected>=plan.requiredTotalAtRetirement,requiredTotalAtRetirement:plan.requiredTotalAtRetirement,projectedAssetsAtRetirement:projected,adjustedAnnualPension:p.adjustedAnnualPension,pensionAdjustRate:p.pensionAdjustRate,retirementSurplus:projected-plan.requiredTotalAtRetirement,coverageRate:coverage,worstStart:plan.worstStart,duration:plan.duration,...stats};if(!fallback||coverage>fallback.coverageRate)fallback=row;if(row.isAchievable)return row}return Object.assign(fallback||{currentAgeMonths:cur,adjustedAnnualPension:p.adjustedAnnualPension,pensionAdjustRate:p.pensionAdjustRate},{isAchievable:false,fireAgeMonths:null})}
function renderCards(results){const grid=document.getElementById('cards-grid');grid.innerHTML='';for(const [key,r] of Object.entries(results)){const card=document.createElement('div');card.className=`rcard ${CLS[key]}`;const badge=key==='conservative'?'戦後最悪経路':`年率 ${formatPercentCompact(RATES[key]*100)}`;let fireSub=r.unavailable?'履歴データを読み込めません':r.isAchievable?formatDurationMonths(r.fireAgeMonths-r.currentAgeMonths):'想定寿命までに未達';let extra='';if(key==='conservative'&&!r.unavailable&&r.worstStart!=null){extra=`<div class="nb"><div class="nb-lbl">Historical Stress 最悪期間</div><div class="nb-val small">${r.historyStart} → ${r.historyEnd}</div><div class="nb-sub">${Math.floor(r.duration/12)}年${r.duration%12?`${r.duration%12}ヶ月`:''} / 同期間CAGR ${formatPercentCompact(r.historyCagr*100)} / ${HISTORY_META.start}以降を全走査</div></div>`}card.innerHTML=`<div class="rcard-head"><div><div class="rcard-name">${LABELS[key]}</div><div class="rcard-rate">${badge}</div></div></div><div class="nb"><div class="nb-lbl">FIRE Age FIRE年齢</div><div class="nb-val gold">${r.isAchievable?formatAgeWithMonths(r.fireAgeMonths):'未達'}</div><div class="nb-sub">${fireSub}</div></div><div class="csep"></div><div class="nb"><div class="nb-lbl">Required Principal 必要元本</div><div class="nb-val">${r.requiredTotalAtRetirement!=null?formatOkuMan(r.requiredTotalAtRetirement):'—'}</div><div class="nb-sub">${r.requiredTotalAtRetirement!=null?formatYen(r.requiredTotalAtRetirement):''}</div></div>${extra}<div class="nb"><div class="nb-lbl">Pension Income 年金受給額</div><div class="nb-val">${formatOkuMan(r.adjustedAnnualPension||0)}</div><div class="nb-sub">${formatPensionAdjustmentNote(r.pensionAdjustRate||1)}</div></div>`;grid.appendChild(card)}}
function renderChart(data){const fb=document.getElementById('chart-fallback');fb.style.display='none';if(chartInst){chartInst.destroy();chartInst=null}if(!Object.keys(data).length){fb.textContent='表示できる成立シナリオがありません。';fb.style.display='block';return}if(typeof Chart==='undefined'){fb.textContent='Chart.jsを読み込めませんでした。';fb.style.display='block';return}const ctx=document.getElementById('myChart').getContext('2d');chartInst=new Chart(ctx,{type:'line',data:{datasets:Object.entries(data).map(([key,s])=>({label:LABELS[key],data:s.ages.map((x,i)=>({x,y:s.bals[i]})),borderColor:COLORS[key],backgroundColor:COLORS[key]+'12',borderWidth:4,pointRadius:0,pointHoverRadius:6,tension:.25,fill:false}))},options:{responsive:true,maintainAspectRatio:false,interaction:{mode:'index',intersect:false},scales:{x:{type:'linear',title:{display:true,text:'年齢（歳）'},ticks:{stepSize:5}},y:{title:{display:true,text:'万円'},ticks:{callback:v=>Math.round(v/10000).toLocaleString('ja-JP')}}},plugins:{legend:{position:'top',align:window.innerWidth<=640?'center':'end'},tooltip:{callbacks:{title:items=>formatAgeWithMonths(Math.round(items[0].parsed.x*12)),label:item=>` ${item.dataset.label}: ${formatOkuMan(item.parsed.y)}`}}}}})}
function updateSimulation(){hideError();hideInfo();const v=getFormValues();updateSliderDisplays(v);saveState(v);const errors=validateInputs(v);if(errors.length){showError(errors);return}const results={optimistic:calculateFixedScenario(RATES.optimistic,v),normal:calculateFixedScenario(RATES.normal,v),conservative:calculateConservativeScenario(v)},chartData={};if(results.optimistic.isAchievable)chartData.optimistic=generateFixedSeries(results.optimistic.fireAgeMonths,results.optimistic.requiredTotalAtRetirement,RATES.optimistic,v);if(results.normal.isAchievable)chartData.normal=generateFixedSeries(results.normal.fireAgeMonths,results.normal.requiredTotalAtRetirement,RATES.normal,v);if(results.conservative.isAchievable)chartData.conservative=generateHistoricalSeries(results.conservative.fireAgeMonths,results.conservative.requiredTotalAtRetirement,results.conservative.worstStart,results.conservative.duration,v);renderCards(results);renderChart(chartData);if(!HIST_RETURNS.length)showInfo('保守シナリオ用のS&P 500月次履歴データを読み込めなかったため、楽観・標準のみ計算しています。');else if(toMonthAge(v.lifeAge)-toMonthAge(v.currentAge)>HIST_RETURNS.length)showInfo(`戦後履歴は${HISTORY_META.start}〜${HISTORY_META.end}（${HIST_RETURNS.length}ヶ月）です。これを超える残存期間では、完全一致する履歴窓が存在する年齢から保守判定を開始します。`)}
function init(){HIST_RETURNS=buildHistoricalReturns();const v=loadState();setFormValues(v);for(const id of NUMBER_IDS)document.getElementById(id).addEventListener('input',updateSimulation);updateSimulation()}
document.addEventListener('DOMContentLoaded',init);
</script>
