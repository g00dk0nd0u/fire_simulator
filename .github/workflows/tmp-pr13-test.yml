name: PR13 temporary validation

on:
  push:
    branches:
      - codex/add-full-index-support-for-recent-based-and-conservative

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rebuild exact pinned local S&P data
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --silent --show-error \
            https://raw.githubusercontent.com/GaMa96/lfc-sp500-data/ac66267d99aaa0f88c41f93acabc639a9a4dd908/data/sp500.js \
            -o /tmp/upstream-sp500.js
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const context={window:{}};
          vm.createContext(context);
          vm.runInContext(fs.readFileSync('/tmp/upstream-sp500.js','utf8'),context);
          const d=context.window.__lfcSpData;
          if(!d || d.start!=='1871-01' || d.end!=='2026-08' || !Array.isArray(d.nomTRP) || d.nomTRP.length!==1868){
            throw new Error(`Unexpected pinned S&P series: start=${d&&d.start} end=${d&&d.end} n=${d&&d.nomTRP&&d.nomTRP.length}`);
          }
          const body="'use strict';\nwindow.__localSp500Data = "+JSON.stringify({start:d.start,end:d.end,nomTRP:d.nomTRP})+";\n";
          fs.writeFileSync('data/sp500.js',body);
          fs.writeFileSync('docs/sp500-data.js',body);
          NODE
          node <<'NODE'
          const fs=require('fs');
          const p='docs/market-data.js';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace('monthlyLevels: window.__lfcSpData || null','monthlyLevels: window.__localSp500Data || null');
          fs.writeFileSync(p,s);
          const t='test/market-data.test.js';
          s=fs.readFileSync(t,'utf8');
          s=s.replace('return c.window.__lfcSpData;','return c.window.__localSp500Data;');
          fs.writeFileSync(t,s);
          NODE

      - run: node --check docs/sp500-data.js
      - run: node --check docs/market-data.js
      - run: node --check docs/app.js
      - run: node test/market-data.test.js
      - run: git diff --check

      - name: Assert local market-data runtime
        shell: bash
        run: |
          test "$(grep -R "cdn.jsdelivr.net/gh/GaMa96/lfc-sp500-data" -n docs | wc -l)" -eq 0
          test "$(grep -R "__lfcSpData" -n docs test data | wc -l)" -eq 0

      - name: Commit generated local data if needed
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git config user.name "g00dk0nd0u"
          git config user.email "161051061+g00dk0nd0u@users.noreply.github.com"
          git add data/sp500.js docs/sp500-data.js docs/market-data.js test/market-data.test.js
          git commit -m "Localize exact pinned S&P 500 history"
          git push origin HEAD:codex/add-full-index-support-for-recent-based-and-conservative
