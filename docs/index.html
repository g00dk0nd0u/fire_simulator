<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>FIRE Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="sp500-data.js"></script>
<script src="market-data.js"></script>
<script src="history-import.js"></script>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="base-market.css">
</head>
<body>
<header class="hero"><h1>FIRE Calculator</h1></header>
<div class="layout">
  <div class="chart-card"><div class="chart-head"><span class="chart-title">Asset Projection 資産の見通し</span><span class="chart-note">各シナリオのFIRE時点を起点に表示</span></div><canvas id="myChart"></canvas><div id="chart-fallback" class="chart-fallback"></div></div>
  <p class="sec">Planning Inputs 入力条件</p>
  <div class="input-panel"><div class="form-grid">
    <div class="fg"><div class="fg-head"><label for="baseMarket"><span>Investment Index</span><span class="label-ja">運用指数（全シナリオ共通）</span></label><span class="slider-value" id="baseMarketDisplay"></span></div><select id="baseMarket"><option value="sp500">S&amp;P 500</option><option value="acwi">MSCI ACWI（オール・カントリー）</option><option value="nasdaq100">NASDAQ-100</option></select><span class="unit"><span>利用可能な最長期間</span><span>名目CAGR</span></span><div id="marketHistoryControls" class="history-controls"><button type="button" id="importHistory">月次履歴を読み込む</button><button type="button" id="deleteHistory">履歴を削除</button></div><div id="marketHistorySummary" class="field-note"></div></div>
    <div class="fg"><div class="fg-head"><label for="currentAge"><span>Current Age</span><span class="label-ja">現在年齢</span></label><span class="slider-value" id="currentAgeDisplay"></span></div><input type="range" id="currentAge" min="0" max="99" step="1"><span class="unit"><span>0-99</span><span>歳</span></span></div>
    <div class="fg"><div class="fg-head"><label for="lifeAge"><span>Life Expectancy</span><span class="label-ja">想定寿命</span></label><span class="slider-value" id="lifeAgeDisplay"></span></div><input type="range" id="lifeAge" min="1" max="120" step="1"><span class="unit"><span>1-120</span><span>歳</span></span></div>
    <div class="fg"><div class="fg-head"><label for="monthlyExpense"><span>Monthly Spending</span><span class="label-ja">月間生活費</span></label><span class="slider-value" id="monthlyExpenseDisplay"></span></div><input type="range" id="monthlyExpense" min="0" max="1000000" step="10000"><span class="unit"><span>0-100万円</span><span>円 / 月</span></span></div>
    <div class="fg"><div class="fg-head"><label for="sp500Asset"><span>Current Assets</span><span class="label-ja">現在の運用資産</span></label><span class="slider-value" id="sp500AssetDisplay"></span></div><input type="range" id="sp500Asset" min="0" max="100000000" step="100000"><span class="unit"><span>0-1億円</span><span>円</span></span></div>
    <div class="fg"><div class="fg-head"><label for="annualSp500Contribution"><span>Annual Investment</span><span class="label-ja">年間平均投資額</span></label><span class="slider-value" id="annualSp500ContributionDisplay"></span></div><input type="range" id="annualSp500Contribution" min="0" max="5000000" step="10000"><span class="unit"><span>0-500万円</span><span>円 / 年</span></span></div>
    <div class="fg"><div class="fg-head"><label for="annualPension"><span>Estimated Pension</span><span class="label-ja">65歳受給時の年金見込額（繰上げ・繰下げ前）</span></label><span class="slider-value" id="annualPensionDisplay"></span></div><input type="range" id="annualPension" min="0" max="4000000" step="10000"><span class="unit"><span>0-400万円</span><span>円 / 年</span></span><div class="field-note"><a href="https://www.nenkin.go.jp/n_net2/index.html" target="_blank" rel="noopener noreferrer">日本年金機構で見込み額を確認</a><br>入力は65歳から受給する場合の年額。選択した開始年齢に応じて自動補正します。</div></div>
    <div class="fg"><div class="fg-head"><label for="pensionStartAge"><span>Pension Start Age</span><span class="label-ja">年金受給開始年齢</span></label><span class="slider-value" id="pensionStartAgeDisplay"></span></div><input type="range" id="pensionStartAge" min="60" max="75" step="1"><span class="unit"><span>60-75</span><span>歳</span></span><div class="field-note" id="pensionPlanDisplay"></div></div>
    <div class="fg"><div class="fg-head"><label for="inflationRate"><span>Inflation Rate</span><span class="label-ja">インフレ率</span></label><span class="slider-value" id="inflationRateDisplay"></span></div><input type="range" id="inflationRate" min="0" max="4.5" step="0.05"><span class="unit"><span>0-4.5</span><span>%</span></span></div>
  </div><div id="error-msg"></div><div id="info-msg" class="info-msg"></div></div>
  <div id="result-section"><p class="sec">FIRE Scenarios シナリオ</p><div class="cards-grid" id="cards-grid"></div></div>
</div>
<dialog id="historyDialog"><form method="dialog"><h2>月次履歴を読み込む</h2><label>Index name<input id="importIndexName" readonly></label><label>Return type<select id="importReturnType"><option>Total Return</option><option>Gross Return</option><option>Net Return</option><option>Price Return</option></select></label><label>Currency<input id="importCurrency" value="USD" required></label><label>CSV file<input id="historyFile" type="file" accept=".csv,text/csv" required></label><p id="returnTypeWarning" class="warning"></p><p id="importError" class="warning"></p><div class="dialog-actions"><button value="cancel">キャンセル</button><button type="button" id="confirmImport">読み込む</button></div></form></dialog>
<script src="app.js"></script>
</body>
</html>
